# Nginx server block for the field server. Replace field.example.com with your name,
# then get the certificate with: certbot --nginx -d field.example.com
# (certbot adds the HTTPS part to this block itself).
server {
    listen 80;
    listen [::]:80;
    server_name field.example.com;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
